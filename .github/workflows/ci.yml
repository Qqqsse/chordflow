name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, unit, build, e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chordflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: chordflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chordflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI database for the PostgreSQL integration tests.
      TEST_DATABASE_URL: postgres://chordflow:ci-only-password@localhost:5432/chordflow_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  worker:
    name: AI worker (pytest, CPU only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest

  compose:
    name: Docker Compose config and image build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker compose --env-file .env.example config -q
      - run: docker compose --env-file .env.example --profile worker --profile tools config -q
      - name: Public overlay config
        env:
          PROXY_NETWORK: proxy
          APP_BASE_URL: https://chordflow.example.org
        run: docker compose --env-file .env.example -f compose.yaml -f deploy/compose.public.yaml config -q
      - run: docker compose --env-file .env.example --profile worker build

  security:
    name: Secret scan and dependency licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (git history)
        run: >-
          docker run --rm -u "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.28.0
          git /repo --redact --no-banner --exit-code 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses:check
