[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chordflow-ai-worker"
version = "0.1.0"
description = "CPU contract runner for chordflow generation jobs (GPU adapters are optional, later)."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# Signal processing for the chord recognition baseline and evaluation (numpy only, BSD).
audio = [
  "numpy>=2.1,<3",
]
dev = [
  "pytest>=8,<10",
  "jsonschema>=4.23,<5",
  "numpy>=2.1,<3",
]

[project.scripts]
chordflow-worker = "chordflow_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
