# Local, CPU-only Compose stack. No GPU required.
#   cp .env.example .env   # replace placeholder secrets first
#   docker compose up -d --build
# Optional worker:  docker compose --profile worker up -d
# WARNING: `docker compose down -v` deletes the database volume. See docs/local-deployment.md.
name: chordflow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chordflow}
      POSTGRES_DB: ${POSTGRES_DB:-chordflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No published port: the database is reachable only on the internal Compose network.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: chordflow-web:local
    restart: unless-stopped
    environment:
      CHORDFLOW_DATA_MODE: ${CHORDFLOW_DATA_MODE:-demo}
      DATABASE_URL: ${DATABASE_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    ports:
      # Loopback only by default. Use a reverse proxy (deploy/compose.public.yaml) for wider access.
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # One-off operator tasks (not started by `up`):
  #   docker compose --profile tools run --rm migrate                    # apply migrations
  #   docker compose --profile tools run --rm migrate pnpm db:seed-demo  # load synthetic demo catalog
  migrate:
    profiles: ['tools']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: build
    image: chordflow-web-build:local
    working_dir: /repo/apps/web
    command: ['pnpm', 'db:migrate']
    restart: 'no'
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles: ['worker']
    build:
      context: services/ai-worker
    image: chordflow-worker:local
    # Until the M7 job loop exists the worker only validates its configuration and exits.
    restart: 'no'
    environment:
      WORKER_API_BASE_URL: ${WORKER_API_BASE_URL:-http://web:3000}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      WORKER_PROCESSOR_MODE: ${WORKER_PROCESSOR_MODE:-mock}
    depends_on:
      web:
        condition: service_healthy

volumes:
  db-data:
